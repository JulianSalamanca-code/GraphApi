version: 1

# Configuración del router
router:
  listen_addr: 0.0.0.0:3000
  graphql_path: /graphql
  playground_enabled: true
  introspection_enabled: true
  
  # Configuración de health check
  health_check:
    enabled: true
    path: /health

# Configuración estática (sin graph token)
execution_config:
  file: /etc/cosmo/router/execution-config.json

# Configuración de telemetría
telemetry:
  enabled: false

# Configuración de CORS
cors:
  enabled: true
  allow_origins:
    - "*"
  allow_methods:
    - GET
    - POST
    - OPTIONS
  allow_headers:
    - Content-Type
    - Authorization

# Subgrafos configurados
subgraphs:
  - name: usuarios
    routing_url: http://usuarios-service:3001/graphql
    schema:
      file: /etc/cosmo/router/subgraphs/usuarios/subgraph.graphql
  
  - name: ordenes
    routing_url: http://ordenes-service:3002/graphql
    schema:
      file: /etc/cosmo/router/subgraphs/ordenes/subgraph.graphql
  
  - name: pedidos
    routing_url: http://pedidos-service:3003/graphql
    schema:
      file: /etc/cosmo/router/subgraphs/pedidos/subgraph.graphql
  
  - name: pagos
    routing_url: http://pagos-service:3004/graphql
    schema:
      file: /etc/cosmo/router/subgraphs/pagos/subgraph.graphql

# Configuración de federation
federation:
  enabled: true
  version: 2
