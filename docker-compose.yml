services:
  consul:
    image: hashicorp/consul:1.17
    container_name: mrcatfood-consul
    ports:
      - "8500:8500"
    volumes:
      - ./consul/config.json:/consul/config/config.json:ro
    command: "agent -server -ui -bootstrap-expect=1 -client=0.0.0.0 -config-file=/consul/config/config.json"
    networks:
      - mrcatfood-network
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  usuarios-service:
    build:
      context: ./services/usuarios-service
      dockerfile: Dockerfile
    container_name: mrcatfood-usuarios
    ports:
      - "3001:3001"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_PORT=3001
      - DB_PATH=/data
    volumes:
      - usuarios-data:/data
    networks:
      - mrcatfood-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ordenes-service:
    build:
      context: ./services/ordenes-service
      dockerfile: Dockerfile
    container_name: mrcatfood-ordenes
    ports:
      - "3002:3002"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_PORT=3002
      - DB_PATH=/data
    volumes:
      - ordenes-data:/data
    networks:
      - mrcatfood-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  pedidos-service:
    build:
      context: ./services/pedidos-service
      dockerfile: Dockerfile
    container_name: mrcatfood-pedidos
    ports:
      - "3003:3003"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_PORT=3003
    networks:
      - mrcatfood-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  pagos-service:
    build:
      context: ./services/pagos-service
      dockerfile: Dockerfile
    container_name: mrcatfood-pagos
    ports:
      - "3004:3004"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_PORT=3004
      - DB_PATH=/data
    volumes:
      - pagos-data:/data
    networks:
      - mrcatfood-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    container_name: mrcatfood-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    networks:
      - mrcatfood-network
    depends_on:
      usuarios-service:
        condition: service_healthy
      ordenes-service:
        condition: service_healthy
      pedidos-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/graphql"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  mrcatfood-network:
    driver: bridge

volumes:
  usuarios-data:
  ordenes-data:
  pedidos-data:
  pagos-data:
