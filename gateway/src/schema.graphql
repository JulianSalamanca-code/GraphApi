type Usuario {
  id: ID!
  nombre: String!
  email: String!
  telefono: String
  activo: Boolean!
  creadoEn: String!
  actualizadoEn: String!
}

type Orden {
  id: ID!
  estado: String!
  usuarioId: ID!
  total: Float!
  creadoEn: String!
  actualizadoEn: String!
}

type Pedido {
  id: ID!
  producto: String!
  descripcion: String
  cantidad: Int!
  precioUnitario: Float!
  subtotal: Float!
  usuarioId: ID!
  ordenId: String
  creadoEn: String!
  actualizadoEn: String!
}

type Pago {
  id: ID!
  monto: Float!
  metodo: String!
  estado: String!
  referencia: String
  ordenId: ID!
  creadoEn: String!
  actualizadoEn: String!
}

type Query {
  usuarios: [Usuario!]!
  usuario(id: ID!): Usuario
  ordenes: [Orden!]!
  orden(id: ID!): Orden
  pedidos(usuarioId: ID, ordenId: ID): [Pedido!]!
  pedido(id: ID!): Pedido
  pagos(ordenId: ID): [Pago!]!
  pago(id: ID!): Pago
}

type Mutation {
  crearUsuario(nombre: String!, email: String!, telefono: String): Usuario!
  actualizarUsuario(id: ID!, nombre: String, email: String, telefono: String, activo: Boolean): Usuario!
  eliminarUsuario(id: ID!): Boolean!
  crearOrden(usuarioId: ID!): Orden!
  actualizarOrden(id: ID!, estado: String): Orden!
  eliminarOrden(id: ID!): Boolean!
  crearPedido(input: CrearPedidoInput!): Pedido!
  actualizarPedido(id: ID!, input: ActualizarPedidoInput!): Pedido!
  eliminarPedido(id: ID!): Boolean!
  crearPago(input: CrearPagoInput!): Pago!
  actualizarPago(id: ID!, input: ActualizarPagoInput!): Pago!
  eliminarPago(id: ID!): Boolean!
}

input CrearPedidoInput {
  producto: String!
  descripcion: String
  cantidad: Int!
  precioUnitario: Float!
  usuarioId: ID!
  ordenId: ID
}

input ActualizarPedidoInput {
  producto: String
  descripcion: String
  cantidad: Int
  precioUnitario: Float
  ordenId: ID
}

input CrearPagoInput {
  monto: Float!
  metodo: String!
  referencia: String
  ordenId: ID!
}

input ActualizarPagoInput {
  monto: Float
  metodo: String
  estado: String
  referencia: String
  ordenId: ID
}
