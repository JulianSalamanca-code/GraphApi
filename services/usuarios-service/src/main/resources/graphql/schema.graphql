scalar DateTime

type Usuario {
  id: ID!
  nombre: String!
  email: String!
  telefono: String
  activo: Boolean!
  creadoEn: DateTime!
  actualizadoEn: DateTime!
}

input CrearUsuarioInput {
  nombre: String!
  email: String!
  telefono: String
}

input ActualizarUsuarioInput {
  nombre: String
  email: String
  telefono: String
  activo: Boolean
}

type Query {
  usuarios: [Usuario!]!
  usuario(id: ID!): Usuario
}

type Mutation {
  crearUsuario(input: CrearUsuarioInput!): Usuario!
  actualizarUsuario(id: ID!, input: ActualizarUsuarioInput!): Usuario!
  eliminarUsuario(id: ID!): Boolean!
}
